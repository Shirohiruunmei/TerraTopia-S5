name: Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Extract OTAPI
        run: unzip -o libs/OTAPI.zip -d libs
      - name: Build
        run: dotnet build TerraTopia.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: TerraTopia-dll
          path: out/TerraTopia.dll
